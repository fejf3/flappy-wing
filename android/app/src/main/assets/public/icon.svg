<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- Sky Background -->
  <rect width="512" height="512" rx="96" fill="#70c5ce" />
  <!-- Ground Strip -->
  <rect x="0" y="420" width="512" height="92" fill="#ded895" />
  <rect x="0" y="400" width="512" height="24" fill="#73bf2e" />
  <rect x="0" y="394" width="512" height="6" fill="#543847" />
  <!-- Pixel Bird (Centered Safe Zone) -->
  <g transform="translate(120, 144) scale(16)">
    <!-- Dark Outline -->
    <rect x="6" y="0" width="6" height="1" fill="#543847" />
    <rect x="4" y="1" width="2" height="1" fill="#543847" />
    <rect x="12" y="1" width="2" height="1" fill="#543847" />
    <rect x="3" y="2" width="1" height="1" fill="#543847" />
    <rect x="10" y="2" width="1" height="1" fill="#543847" />
    <rect x="14" y="2" width="1" height="1" fill="#543847" />
    <rect x="2" y="3" width="1" height="4" fill="#543847" />
    <rect x="15" y="3" width="1" height="3" fill="#543847" />
    <rect x="12" y="6" width="5" height="1" fill="#543847" />
    <rect x="11" y="7" width="1" height="1" fill="#543847" />
    <rect x="16" y="7" width="1" height="1" fill="#543847" />
    <rect x="3" y="8" width="1" height="1" fill="#543847" />
    <rect x="11" y="8" width="6" height="1" fill="#543847" />
    <rect x="4" y="9" width="1" height="1" fill="#543847" />
    <rect x="12" y="9" width="1" height="1" fill="#543847" />
    <rect x="16" y="9" width="1" height="1" fill="#543847" />
    <rect x="5" y="10" width="2" height="1" fill="#543847" />
    <rect x="12" y="10" width="5" height="1" fill="#543847" />
    <rect x="7" y="11" width="5" height="1" fill="#543847" />
    <!-- Yellow Body -->
    <rect x="6" y="1" width="6" height="1" fill="#f8e71c" />
    <rect x="4" y="2" width="6" height="6" fill="#f8e71c" />
    <rect x="3" y="3" width="8" height="5" fill="#f8e71c" />
    <!-- Orange Underbelly -->
    <rect x="4" y="8" width="7" height="1" fill="#f5a623" />
    <rect x="5" y="9" width="7" height="1" fill="#f5a623" />
    <rect x="7" y="10" width="5" height="1" fill="#f5a623" />
    <!-- Eye -->
    <rect x="11" y="2" width="3" height="4" fill="#ffffff" />
    <rect x="13" y="3" width="1" height="2" fill="#543847" />
    <!-- Wing -->
    <rect x="3" y="4" width="6" height="3" fill="#ffffff" />
    <rect x="3" y="6" width="6" height="1" fill="#f7f2d7" />
    <!-- Beak -->
    <rect x="12" y="7" width="4" height="1" fill="#f75a1b" />
    <rect x="13" y="9" width="3" height="1" fill="#d03b0d" />
  </g>
</svg>
